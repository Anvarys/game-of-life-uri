<style>
  body{
    background:black;color:white;font-family:monospace;margin:0;overflow:hidden;
  }
  #c{
    width:4000px;
    height:4000px;
    transform-origin:0 0;
    background:#111;
    image-rendering:pixelated;
    outline:20px solid #222; 
    border-radius:12px
  }
  #b{
    position:fixed;
    top:20px;
    left:20px;
    display: flex;
    flex-direction: column;
    gap:20px;
  }
  #d{
    position:fixed;
    left:20px;
    bottom:0px;
    color:#ee59ff;
    font-weight: 600;
    font-size: 1.2rem;
    text-shadow: 0 0 8px #e600ff ;
  }
  #y{
    color: #ee59ff;
    font-weight: 600;
  }
  #w{
    display: flex;
    width: 100%;
    flex-direction: row;
    justify-content: space-between;
    -webkit-text-stroke: 2px black;
    paint-order: stroke fill;
  }
  #f{
    accent-color:#ee59ff;
    width: 100%;
    -webkit-text-stroke: 2px black;
  }
  button{
    font-size: 1.2rem;
    border-radius: 1rem;
    padding: .5rem;
    border: none;
    background: #ee59ff;
    box-shadow: 0 0 12px #e600ff;
    font-family: monospace;
    transition-duration: .2s;
  }
  button:hover{
    background: #c827da;
    cursor: pointer;
    box-shadow: 0 0 12px #e600ff;
  }
  #m{
    width: 16rem;
  }
  #b,#d{
    transition: transform .3s ease;
  }
  #b.h, #d.h{
    transform: translateX(calc(-100% - 40px));
    transition: transform .3s ease;
  }
</style>
<body>
  <canvas id=c width=200 height=200></canvas>
  <div id=b>
    <button id=m>Mouse: moving</button>
    <button id=p>Pause</button>
    <button id=l>Clear everything</button>
    <button id=h>Set color</button>
    <input type=color id=H hidden oninput="Q = this.value">
    <div id=y>
      <div id=w>
        <p id=I>Iterations/s</p>
        <p id=z>10</p>
      </div>
      <input type=range id=f min=1 max=20 value=10 oninput="Z = this.value; clearInterval(k); k = setInterval(K, Math.round(1000/Z)); z.textContent=Z">
    </div>
  </div>

  <div id=d>
    <p id=u></p>
  </div>
  <script>
    x = 0, y = 0, n = 200, scale = .25, R=1, M=1, T=0, V=null, s=0, F=1, Q='white', Z=10; t=() => c.style.transform = `translate(${x}px,${y}px) scale(${scale})`

    f.onpointerdown = _=> F = 0
    f.onpointerup = _=> F = 1

    onwheel = e => {
      let f = Math.exp(-e.deltaY/500)
      x = e.clientX-(e.clientX-x)*f
      y = e.clientY-(e.clientY-y)*f
      scale *= f
      t()
    }
    onmousemove = e => {
      if (e.buttons && M && F) {
        x += e.movementX
        y += e.movementY
        t()
      }
    }
    t()
    g = [...Array(n*n)].map(_=>Math.random()<.3)
    console.log(g)
    C = c.getContext`2d`
    render = _ => {
      C.clearRect(0,0,n,n);
      C.fillStyle = C.shadowColor = Q
      g.map((v, i) => {
        C.shadowBlur = 4
        v&&C.fillRect(i%n,i/n|0,1,1)
      })
    }
    K = _=>R && (g = g.map((v, i) => {
      for(s = 0 /* alive neighbors */, j = 9; j--;) {
        X=i%n+j%3-1; 
        Y=(i/n|0)+(j/3|0)-1; 
        s += j!=4 && X>=0 && X<n && Y>=0 && Y < n && g[Y*n+X]
      }
      return s==3 || v && s == 2
    }), render(), T++, u.textContent=`Time: ${T}`)

    k = setInterval(K, 1000/Z|1)
    Rf = _=> p.textContent=(R^=1)?'Pause':'Play'
    Mf = _=> m.textContent='Mouse: '+((M^=1)?'moving':'drawing')
    p.onclick = Rf
    m.onclick = Mf

    q = e => { // get clicked coords
      r=c.getBoundingClientRect()
      X=Math.floor((e.clientX-r.left)/r.width*n)
      Y=Math.floor((e.clientY-r.top)/r.height*n)
      return X>=0 && X<n && Y>=0 && Y<n ? Y*n+X : -1
    }
    c.onpointerdown = e => {
      i=q(e)
      if (!M && i>=0 && F){
        c.setPointerCapture(e.pointerId)
        g[i]=V=!g[i]
        render()
      }
    }

    c.onpointermove = e => {
      i=q(e)
      V!=null && i>=0 && (g[i]=V, render())
    }

    c.onpointerup=_=>V=null

    l.onclick = _ => g = [...Array(n*n)].fill(0)

    onkeydown = e => { e.code == "Space" ? Rf() : e.code == "KeyX" ? Mf() : e.code == "KeyH" && ([b,d].map(_=>_.classList.toggle("h"))) }
  </script>
</body>
